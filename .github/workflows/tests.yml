name: k3s Testing
on:
  pull_request:
    branches: [ master ]

jobs:
  build-images:
    concurrency:
      group: "build-images-${{ github.event.number }}"
      cancel-in-progress: true
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set image tag
        id: image_tag
        run: echo "value=ci-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build worker and balancer images
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.value }}
        run: |
          set -euo pipefail
          docker build --tag "manticoresearch/helm-worker:${IMAGE_TAG}" ./sources/manticore-worker
          docker build --tag "manticoresearch/helm-balancer:${IMAGE_TAG}" ./sources/manticore-balancer
          docker save \
            "manticoresearch/helm-worker:${IMAGE_TAG}" \
            "manticoresearch/helm-balancer:${IMAGE_TAG}" \
            | gzip -1 > /tmp/manticoresearch-clt-images.tar.gz

      - name: Upload CLT images
        uses: actions/upload-artifact@v4
        with:
          name: clt-images
          path: /tmp/manticoresearch-clt-images.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  discover:
    needs: [build-images]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: build
        name: Build matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path("clt_tests/tests")
          # Discover only top-level scenario recordings. init/*.recb files are helpers.
          groups = {1: [], 2: [], 3: []}
          invalid = []
          for path in sorted(root.glob("*.rec")):
              match = re.match(r"^([1-3])-", path.name)
              if not match:
                  invalid.append(str(path))
                  continue
              groups[int(match.group(1))].append(str(path.with_suffix("")))

          if invalid:
              raise SystemExit(
                  "CLT test files must start with a thread prefix 1-, 2-, or 3-: "
                  + ", ".join(invalid)
              )

          tests_count = sum(len(group) for group in groups.values())
          if not tests_count:
              matrix = {"chunk": []}
          else:
              chunks = []
              for thread_id, group in groups.items():
                  if not group:
                      continue
                  chunks.append(
                      {
                          "id": thread_id,
                          "test_prefix": "\n".join(group),
                      }
                  )
              matrix = {"chunk": chunks}

          print(f"Found {tests_count} .rec tests across {len(matrix['chunk'])} jobs")
          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
          PY

  tests:
    needs: [build-images, discover]
    concurrency:
      group: "tests-${{ github.event.number }}-${{ matrix.chunk.id }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: debianmaster/actions-k3s@master
        id: k3s
        with:
          version: 'latest'

      - name: Wait for k3s to be ready
        run: |
          echo "Waiting for k3s to be ready"
          until kubectl get nodes --kubeconfig ${{ steps.k3s.outputs.kubeconfig }} | grep -q " Ready "; do
            echo "Waiting..."
            sleep 2
          done
          echo "k3s is ready"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download CLT images
        uses: actions/download-artifact@v4
        with:
          name: clt-images
          path: /tmp

      - name: Import CLT images into k3s
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
        run: |
          set -euo pipefail
          gzip -dc /tmp/manticoresearch-clt-images.tar.gz | docker exec -i k3s-latest ctr -n k8s.io images import -
          docker exec k3s-latest ctr -n k8s.io images ls | grep -F "manticoresearch/helm-worker:${IMAGE_TAG}"
          docker exec k3s-latest ctr -n k8s.io images ls | grep -F "manticoresearch/helm-balancer:${IMAGE_TAG}"

      - name: Write CLT image values
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
        run: |
          printf '%s\n' \
            'worker:' \
            '  image:' \
            '    repository: manticoresearch/helm-worker' \
            "    tag: ${IMAGE_TAG}" \
            '    pullPolicy: Never' \
            'balancer:' \
            '  image:' \
            '    repository: manticoresearch/helm-balancer' \
            "    tag: ${IMAGE_TAG}" \
            '    pullPolicy: Never' \
            > clt_tests/ci-images.yaml

      - uses: manticoresoftware/clt@0.7.8
        with:
          image: manticoresearch/helm-test-kit:0.0.1
          test_prefix: ${{ matrix.chunk.test_prefix }}
          run_args: -e TELEMETRY=0 --net=host -v ${{ steps.k3s.outputs.kubeconfig }}:${{ steps.k3s.outputs.kubeconfig }} -v $(pwd)/charts/:/.clt/charts/ -v $(pwd)/clt_tests/ci-images.yaml:/tmp/clt-ci-images.yaml:ro
