name: Publish Helm development images
run-name: Publish Helm dev images from ${{ inputs.manticore_tag }}

on:
  workflow_dispatch:
    inputs:
      manticore_tag:
        description: Exact Manticore development image tag, for example dev-28.6.7-e8149e7
        required: true
        type: string

concurrency:
  group: publish-helm-development-images
  cancel-in-progress: false

jobs:
  build-balancer-amd64:
    if: github.ref == 'refs/heads/master'
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push balancer (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./sources/manticore-balancer
          platforms: linux/amd64
          push: true
          tags: manticoresearch/helm-balancer:dev-amd64
          build-args: |
            MANTICORE_TAG=${{ inputs.manticore_tag }}
          cache-from: type=registry,ref=manticoresearch/helm-balancer:cache-amd64
          cache-to: type=inline
          provenance: false

  build-balancer-arm64:
    if: github.ref == 'refs/heads/master'
    runs-on: [ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push balancer (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./sources/manticore-balancer
          platforms: linux/arm64
          push: true
          tags: manticoresearch/helm-balancer:dev-arm64
          build-args: |
            MANTICORE_TAG=${{ inputs.manticore_tag }}
          cache-from: type=registry,ref=manticoresearch/helm-balancer:cache-arm64
          cache-to: type=inline
          provenance: false

  build-worker-amd64:
    if: github.ref == 'refs/heads/master'
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push worker (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./sources/manticore-worker
          platforms: linux/amd64
          push: true
          tags: manticoresearch/helm-worker:dev-amd64
          build-args: |
            MANTICORE_TAG=${{ inputs.manticore_tag }}
          cache-from: type=registry,ref=manticoresearch/helm-worker:cache-amd64
          cache-to: type=inline
          provenance: false

  build-worker-arm64:
    if: github.ref == 'refs/heads/master'
    runs-on: [ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push worker (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./sources/manticore-worker
          platforms: linux/arm64
          push: true
          tags: manticoresearch/helm-worker:dev-arm64
          build-args: |
            MANTICORE_TAG=${{ inputs.manticore_tag }}
          cache-from: type=registry,ref=manticoresearch/helm-worker:cache-arm64
          cache-to: type=inline
          provenance: false

  create-manifests:
    if: github.ref == 'refs/heads/master'
    needs: [build-balancer-amd64, build-balancer-arm64, build-worker-amd64, build-worker-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push balancer manifest
        run: |
          docker manifest create manticoresearch/helm-balancer:dev \
            --amend manticoresearch/helm-balancer:dev-amd64 \
            --amend manticoresearch/helm-balancer:dev-arm64
          docker manifest push --purge manticoresearch/helm-balancer:dev

      - name: Create and push worker manifest
        run: |
          docker manifest create manticoresearch/helm-worker:dev \
            --amend manticoresearch/helm-worker:dev-amd64 \
            --amend manticoresearch/helm-worker:dev-arm64
          docker manifest push --purge manticoresearch/helm-worker:dev
